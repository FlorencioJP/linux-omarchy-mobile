%YAML 1.2
---
$id: http://devicetree.org/schemas/media/i2c/semco,sem1215sa.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: SEMCO SEM1215SA camera lens autofocus and stabilisation controller

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  Samsung Electro-Mechanics' SEM1215SA drives a camera module's focus and
  optical image stabilisation actuators and holds the module's calibration
  memory, controlled over I2C with 16-bit register addresses. It is the
  controller of the Google Pixel 7 Pro's folded telephoto module.

properties:
  compatible:
    const: semco,sem1215sa

  reg:
    maxItems: 1

  vbb-supply:
    description: Board supply feeding the module's regulators, switched on first.

  vio-supply:
    description: Interface (1.8 V) supply.

  vdd-supply:
    description: Actuator supply.

  vsw-supply:
    description: A switched module supply, on after vdd-supply.

required:
  - compatible
  - reg
  - vio-supply
  - vdd-supply

additionalProperties: false

examples:
  - |
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        lens@34 {
            compatible = "semco,sem1215sa";
            reg = <0x34>;
            vio-supply = <&vddio_cam>;
            vdd-supply = <&tele_module>;
            vsw-supply = <&tele_sw>;
        };
    };
