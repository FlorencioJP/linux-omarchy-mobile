# SPDX-License-Identifier: GPL-2.0-only
%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/google,gs201-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google GS201 SoC clock controller

maintainers:
  - Derek Ross <derekross@gmail.com>

description: |
  The Google GS201 (Tensor G2) clock controller is made of several CMU units,
  each generating clocks for one domain. The CMU units are modelled as
  separate device tree nodes and may depend on each other. The root clock of
  the tree is OSCCLK (24.576 MHz), which must be described as a fixed-rate
  clock in the dts.

  CMU_TOP is the top-level CMU: it prepares the base clocks with PLLs and
  dividers. The other CMUs take their bus and IP clocks from CMU_TOP, except
  CMU_APM, which is in the always-on (ALIVE) domain and runs from its own
  PLL_ALV and OSCCLK. CMU_APM is shared with the APM (ACPM) firmware, so the
  OS only describes the clocks of the peripherals it uses there.

  Each clock is assigned an identifier and client nodes use this identifier
  to name the clock they consume. The identifiers are defined as preprocessor
  macros in 'include/dt-bindings/clock/google,gs201.h'.

properties:
  compatible:
    enum:
      - google,gs201-cmu-top
      - google,gs201-cmu-apm
      - google,gs201-cmu-disp
      - google,gs201-cmu-dpu
      - google,gs201-cmu-hsi0
      - google,gs201-cmu-hsi2
      - google,gs201-cmu-misc
      - google,gs201-cmu-peric0
      - google,gs201-cmu-peric1

  clocks:
    minItems: 1
    maxItems: 5

  clock-names:
    minItems: 1
    maxItems: 5

  "#clock-cells":
    const: 1

  power-domains:
    maxItems: 1

  reg:
    maxItems: 1

  samsung,sysreg:
    $ref: /schemas/types.yaml#/definitions/phandle
    description:
      Phandle to the system registers interface of this CMU's block.

required:
  - compatible
  - "#clock-cells"
  - clocks
  - clock-names
  - reg

allOf:
  - if:
      properties:
        compatible:
          contains:
            enum:
              - google,gs201-cmu-apm
              - google,gs201-cmu-top
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)

        clock-names:
          items:
            - const: oscclk

        samsung,sysreg: false

  - if:
      properties:
        compatible:
          contains:
            enum:
              - google,gs201-cmu-disp
              - google,gs201-cmu-dpu
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: Display (DISP) or DPU bus clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: bus

  - if:
      properties:
        compatible:
          contains:
            const: google,gs201-cmu-hsi0
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: HSI0 bus clock (from CMU_TOP)
            - description: DPGTC (from CMU_TOP)
            - description: USB DRD controller clock (from CMU_TOP)
            - description: USB Display Port debug clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: dpgtc
            - const: usb31drd
            - const: usbdpdbg

  - if:
      properties:
        compatible:
          contains:
            const: google,gs201-cmu-hsi2
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: High Speed Interface bus clock (from CMU_TOP)
            - description: High Speed Interface pcie clock (from CMU_TOP)
            - description: High Speed Interface ufs clock (from CMU_TOP)
            - description: High Speed Interface mmc clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: pcie
            - const: ufs
            - const: mmc

  - if:
      properties:
        compatible:
          contains:
            const: google,gs201-cmu-misc
    then:
      properties:
        clocks:
          items:
            - description: Misc bus clock (from CMU_TOP)
            - description: Misc sss clock (from CMU_TOP)

        clock-names:
          items:
            - const: bus
            - const: sss

  - if:
      properties:
        compatible:
          contains:
            enum:
              - google,gs201-cmu-peric0
              - google,gs201-cmu-peric1
    then:
      properties:
        clocks:
          items:
            - description: External reference clock (24.576 MHz)
            - description: Connectivity Peripheral 0/1 bus clock (from CMU_TOP)
            - description: Connectivity Peripheral 0/1 IP clock (from CMU_TOP)

        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: ip

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,gs201.h>

    cmu_top: clock-controller@1e080000 {
        compatible = "google,gs201-cmu-top";
        reg = <0x1e080000 0x10000>;
        #clock-cells = <1>;
        clocks = <&oscclk>;
        clock-names = "oscclk";
    };

    clock-controller@10010000 {
        compatible = "google,gs201-cmu-misc";
        reg = <0x10010000 0x10000>;
        #clock-cells = <1>;
        clocks = <&cmu_top CLK_DOUT_CMU_MISC_NOC>,
                 <&cmu_top CLK_DOUT_CMU_MISC_SSS>;
        clock-names = "bus", "sss";
    };

...
