%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/google,zumapro-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google Tensor G4 clock controllers

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

description: |
  CMU_TOP supplies the NoC and UFS clock paths to CMU_HSI2 and the supply-GPIO
  path in CMU_PERIC0. CMU_TOP also provides the HSI0 parent rate paths.
  CMU_MISC supplies the firmware-owned watchdog bus clock paths.
  CMU_HSI0 supplies the USB, eUSB2 PHY and touchscreen USI2 clocks; its
  ALT and TCXO inputs are board-level fixed clocks.
  CMU_G3D supplies the GPU's core, coregroup and stacks clocks from its two
  PLLs and CMU_TOP's G3D NoC, global and switch clocks.
  CMU_HSI1 supplies the HSI1 GPIO bank's clock; its ALT input is a
  board-level fixed clock.
  CMU_APM supplies the always-on GPIO banks, the APM mailbox and its
  internal memory from the always-on ALV PLL and the oscillator.
  CMU_PERIC1 supplies the PERIC1 GPIO bank and USI9 (the I2C bus of the
  NFC controller and the haptics driver) from CMU_TOP's PERIC1 NoC and IP
  clocks.
  The external oscillator supplies the PLL reference and oscillator mux
  paths.
  Clock identifiers are defined in dt-bindings/clock/google,zumapro.h.

properties:
  compatible:
    enum:
      - google,zumapro-cmu-top
      - google,zumapro-cmu-apm
      - google,zumapro-cmu-g3d
      - google,zumapro-cmu-hsi0
      - google,zumapro-cmu-hsi1
      - google,zumapro-cmu-hsi2
      - google,zumapro-cmu-peric0
      - google,zumapro-cmu-peric1
      - google,zumapro-cmu-misc

  reg:
    maxItems: 1

  "#clock-cells":
    const: 1

  clocks:
    minItems: 1
    maxItems: 5

  clock-names:
    minItems: 1
    maxItems: 5

  power-domains:
    maxItems: 1

required:
  - compatible
  - reg
  - "#clock-cells"
  - clocks
  - clock-names

allOf:
  - if:
      properties:
        compatible:
          enum:
            - google,zumapro-cmu-top
            - google,zumapro-cmu-apm
    then:
      properties:
        clocks:
          items:
            - description: External oscillator reference clock
        clock-names:
          items:
            - const: oscclk
  - if:
      properties:
        compatible:
          const: google,zumapro-cmu-hsi0
    then:
      properties:
        clocks:
          items:
            - description: External oscillator reference clock
            - description: HSI0 NoC clock from CMU_TOP
            - description: HSI0 peripheral clock from CMU_TOP
            - description: HSI0 ALT input clock
            - description: HSI0 TCXO input clock
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: peri
            - const: alt
            - const: tcxo
  - if:
      properties:
        compatible:
          const: google,zumapro-cmu-hsi1
    then:
      properties:
        clocks:
          items:
            - description: External oscillator reference clock
            - description: HSI1 NoC clock from CMU_TOP
            - description: HSI1 ALT input clock
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: alt
  - if:
      properties:
        compatible:
          not:
            enum:
              - google,zumapro-cmu-hsi0
              - google,zumapro-cmu-hsi1
    then:
      properties:
        power-domains: false
  - if:
      properties:
        compatible:
          const: google,zumapro-cmu-g3d
    then:
      properties:
        clocks:
          items:
            - description: External oscillator reference clock
            - description: G3D NoC clock from CMU_TOP
            - description: G3D global clock from CMU_TOP
            - description: G3D switch clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: glb
            - const: switch
  - if:
      properties:
        compatible:
          const: google,zumapro-cmu-hsi2
    then:
      properties:
        clocks:
          items:
            - description: HSI2 oscillator clock
            - description: HSI2 NoC clock from CMU_TOP
            - description: HSI2 UFS clock from CMU_TOP
            - description: HSI2 PCIe clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: ufs
            - const: pcie
  - if:
      properties:
        compatible:
          const: google,zumapro-cmu-peric1
    then:
      properties:
        clocks:
          items:
            - description: External oscillator reference clock
            - description: PERIC1 NoC clock from CMU_TOP
            - description: PERIC1 USI input clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus
            - const: ip
  - if:
      properties:
        compatible:
          enum:
            - google,zumapro-cmu-peric0
            - google,zumapro-cmu-misc
    then:
      properties:
        clocks:
          items:
            - description: Domain oscillator reference clock
            - description: Domain NoC clock from CMU_TOP
        clock-names:
          items:
            - const: oscclk
            - const: bus

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/google,zumapro.h>

    cmu_top: clock-controller@26040000 {
        compatible = "google,zumapro-cmu-top";
        reg = <0x26040000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>;
        clock-names = "oscclk";
    };

    clock-controller@11000000 {
        compatible = "google,zumapro-cmu-hsi0";
        reg = <0x11000000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>, <&cmu_top CLK_DOUT_HSI0_NOC>,
                 <&cmu_top CLK_DOUT_HSI0_PERI>, <&hsi0_alt>, <&hsi0_tcxo>;
        clock-names = "oscclk", "bus", "peri", "alt", "tcxo";
    };

    clock-controller@13000000 {
        compatible = "google,zumapro-cmu-hsi2";
        reg = <0x13000000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>, <&cmu_top CLK_DOUT_HSI2_NOC>,
                 <&cmu_top CLK_DOUT_HSI2_UFS>,
                 <&cmu_top CLK_DOUT_HSI2_PCIE>;
        clock-names = "oscclk", "bus", "ufs", "pcie";
    };

    clock-controller@10010000 {
        compatible = "google,zumapro-cmu-misc";
        reg = <0x10010000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>, <&cmu_top CLK_DOUT_MISC_NOC>;
        clock-names = "oscclk", "bus";
    };

    clock-controller@10800000 {
        compatible = "google,zumapro-cmu-peric0";
        reg = <0x10800000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>, <&cmu_top CLK_DOUT_PERIC0_NOC>;
        clock-names = "oscclk", "bus";
    };

    clock-controller@12000000 {
        compatible = "google,zumapro-cmu-hsi1";
        reg = <0x12000000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>, <&cmu_top CLK_DOUT_HSI1_NOC>, <&hsi1_alt>;
        clock-names = "oscclk", "bus", "alt";
    };

    clock-controller@10c00000 {
        compatible = "google,zumapro-cmu-peric1";
        reg = <0x10c00000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>, <&cmu_top CLK_DOUT_PERIC1_NOC>,
                 <&cmu_top CLK_DOUT_PERIC1_IP>;
        clock-names = "oscclk", "bus", "ip";
    };

    clock-controller@15400000 {
        compatible = "google,zumapro-cmu-apm";
        reg = <0x15400000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>;
        clock-names = "oscclk";
    };

    clock-controller@1ee00000 {
        compatible = "google,zumapro-cmu-g3d";
        reg = <0x1ee00000 0x8000>;
        #clock-cells = <1>;
        clocks = <&oscclk>, <&cmu_top CLK_DOUT_G3D_NOCD>,
                 <&cmu_top CLK_DOUT_G3D_GLB>, <&cmu_top CLK_DOUT_G3D_SWITCH>;
        clock-names = "oscclk", "bus", "glb", "switch";
    };
...
