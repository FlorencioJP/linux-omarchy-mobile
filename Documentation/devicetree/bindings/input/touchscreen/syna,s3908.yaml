%YAML 1.2
---
$id: http://devicetree.org/schemas/input/touchscreen/syna,s3908.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Synaptics TouchComm SPI touchscreen controllers

description:
  Synaptics touchscreen controllers that use the TouchComm protocol over
  SPI, such as the S3908 found in the Google Pixel 7 Pro. The sensor size
  is read from the controller; the touchscreen-* properties only adjust it.

maintainers:
  - Derek Ross <derekross@gmail.com>

allOf:
  - $ref: touchscreen.yaml#
  - $ref: /schemas/spi/spi-peripheral-props.yaml#

properties:
  compatible:
    const: syna,s3908

  reg:
    maxItems: 1

  interrupts:
    description: ATTN line, active low
    maxItems: 1

  reset-gpios:
    maxItems: 1

  vdd-supply:
    description: 1.8 V digital and I/O supply

  avdd-supply:
    description: 3.3 V analog supply

  spi-max-frequency: true
  touchscreen-inverted-x: true
  touchscreen-inverted-y: true
  touchscreen-size-x: true
  touchscreen-size-y: true
  touchscreen-swapped-x-y: true
  touchscreen-x-mm: true
  touchscreen-y-mm: true

additionalProperties: false

required:
  - compatible
  - reg
  - interrupts
  - reset-gpios

examples:
  - |
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/gpio/gpio.h>
    spi {
      #address-cells = <1>;
      #size-cells = <0>;

      touchscreen@0 {
        compatible = "syna,s3908";
        reg = <0>;
        interrupt-parent = <&gpa7>;
        interrupts = <0 IRQ_TYPE_LEVEL_LOW>;
        reset-gpios = <&gpp23 2 GPIO_ACTIVE_LOW>;
        vdd-supply = <&ts_vdd>;
        avdd-supply = <&ts_avdd>;
        spi-max-frequency = <10000000>;
        touchscreen-x-mm = <71>;
        touchscreen-y-mm = <154>;
      };
    };
