%YAML 1.2
---
$id: http://devicetree.org/schemas/display/panel/google,tg4c.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Google TG4C AMOLED DSI panel

description:
  The TG4C is the 1080x2424 command-mode AMOLED panel of the Google Pixel
  9a. It takes DSC 1.2 compressed pixel data (two 540x24 slices at 8 bits
  per pixel) over four MIPI DSI lanes, reports its refresh timing on a
  tearing effect (TE) line and runs at 60 or 120 Hz.

maintainers:
  - W4HO <87742609+W4HO-ham@users.noreply.github.com>

allOf:
  - $ref: panel-common.yaml#

properties:
  compatible:
    const: google,tg4c

  reg:
    maxItems: 1

  reset-gpios: true

  vddi-supply:
    description: I/O supply

  vddd-supply:
    description: Digital core supply

  vci-supply:
    description: Analog supply

required:
  - compatible
  - reg

unevaluatedProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>

    dsi {
        #address-cells = <1>;
        #size-cells = <0>;

        panel@0 {
            compatible = "google,tg4c";
            reg = <0>;
            reset-gpios = <&gpp0 0 GPIO_ACTIVE_LOW>;
            vci-supply = <&vci>;
            vddi-supply = <&vddi>;
            vddd-supply = <&vddd>;
        };
    };

...
