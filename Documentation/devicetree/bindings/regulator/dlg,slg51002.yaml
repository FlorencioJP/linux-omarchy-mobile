%YAML 1.2
---
$id: http://devicetree.org/schemas/regulator/dlg,slg51002.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Dialog Semiconductor SLG51002 camera power management IC

maintainers:
  - Derek Ross <derekross@gmail.com>

description:
  The SLG51002 has eight low dropout regulators (LDO1-LDO5 for analog
  supplies, LDO6-LDO8 for low voltage digital supplies) and four load
  switches. A chip select input wakes it from a low power reset.

properties:
  compatible:
    const: dlg,slg51002

  reg:
    maxItems: 1

  dlg,cs-gpios:
    maxItems: 1
    description:
      Chip select. Driven high to wake the chip, low to put it back into
      its low power reset state.

  vin1-2-supply:
    description: Input supply for LDO1 and LDO2.

  vin3-supply:
    description: Input supply for LDO3.

  vin4-supply:
    description: Input supply for LDO4.

  vin5-supply:
    description: Input supply for LDO5.

  vin6-supply:
    description: Input supply for LDO6.

  vin7-supply:
    description: Input supply for LDO7.

  vin8-supply:
    description: Input supply for LDO8.

  regulators:
    type: object
    additionalProperties: false

    patternProperties:
      "^ldo[1-8]$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false

        required:
          - regulator-name

      "^sw[1-4]$":
        type: object
        $ref: /schemas/regulator/regulator.yaml#
        unevaluatedProperties: false
        description: Load switch.

        required:
          - regulator-name

required:
  - compatible
  - reg
  - dlg,cs-gpios
  - regulators

additionalProperties: false

examples:
  - |
    #include <dt-bindings/gpio/gpio.h>
    i2c {
        #address-cells = <1>;
        #size-cells = <0>;

        pmic@75 {
            compatible = "dlg,slg51002";
            reg = <0x75>;
            dlg,cs-gpios = <&pmic_gpio 0 GPIO_ACTIVE_HIGH>;
            vin1-2-supply = <&pp3200_bb_cam>;
            vin6-supply = <&pp1300_cam>;

            regulators {
                ldo2 {
                    regulator-name = "uw_avdd";
                    regulator-min-microvolt = <2850000>;
                    regulator-max-microvolt = <2850000>;
                };

                ldo6 {
                    regulator-name = "uw_dvdd";
                    regulator-min-microvolt = <1100000>;
                    regulator-max-microvolt = <1100000>;
                };

                sw4 {
                    regulator-name = "front_sw";
                };
            };
        };
    };
